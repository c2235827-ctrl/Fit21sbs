<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fit21</title>
  
  <!-- PWA SETUP -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00E87A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fit21">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/12563/12563330.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@800&display=swap" rel="stylesheet">
  
  <style>
    /* Base / Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0A0A0A;
      color: white;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- AUTH MODAL -->
  <div id="authOverlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; display: none; align-items: flex-end; justify-content: center; padding: 0;">
    <div id="authModal" style="background: #111111; border-radius: 24px 24px 0 0; padding: 32px 24px 48px; width: 100%; max-width: 480px; position: relative; animation: slideUp 0.35s cubic-bezier(0.16,1,0.3,1);">
      <!-- Close button -->
      <button onclick="closeAuthModal()" style="position: absolute; top: 16px; right: 16px; background: #222; border: none; width: 32px; height: 32px; border-radius: 50%; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;">×</button>

      <!-- Logo -->
      <div style="text-align:center; margin-bottom: 24px;">
        <img src="/icons/icon-192.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/12563/12563330.png'" width="56" height="56" style="border-radius:14px; margin-bottom:10px;">
        <div style="font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: #FFFFFF;">Fit21</div>
      </div>

      <!-- STEP 1: Phone -->
      <div id="authStep1">
        <p style="font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; margin-bottom: 6px;">Enter your phone number</p>
        <p style="font-family: 'Inter', sans-serif; font-size: 13px; color: #666; margin-bottom: 20px;">We'll send you a one-time code to verify.</p>

        <!-- Phone input with country code -->
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <select id="countryCode" style="background: #1A1A1A; border: 1px solid #2A2A2A; color: white; border-radius: 12px; padding: 14px 10px; font-family: 'Inter', sans-serif; font-size: 14px; width: 110px; flex-shrink: 0; cursor: pointer; outline: none;">
            <option value="+234">🇳🇬 +234</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+233">🇬🇭 +233</option>
            <option value="+254">🇰🇪 +254</option>
            <option value="+27">🇿🇦 +27</option>
            <option value="+256">🇺🇬 +256</option>
            <option value="+255">🇹🇿 +255</option>
            <option value="+251">🇪🇹 +251</option>
            <option value="+212">🇲🇦 +212</option>
            <option value="+20">🇪🇬 +20</option>
            <option value="+91">🇮🇳 +91</option>
            <option value="+86">🇨🇳 +86</option>
            <option value="+49">🇩🇪 +49</option>
            <option value="+33">🇫🇷 +33</option>
          </select>
          <input type="tel" id="phoneInput" placeholder="800 000 0000" style="flex: 1; background: #1A1A1A; border: 1px solid #2A2A2A; color: white; border-radius: 12px; padding: 14px 16px; font-family: 'Inter', sans-serif; font-size: 16px; outline: none; transition: border-color 0.2s;" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onfocus="this.style.borderColor='#00E87A'" onblur="this.style.borderColor='#2A2A2A'">
        </div>

        <div id="phoneError" style="color: #FF4444; font-size: 13px; margin-bottom: 12px; display: none;"></div>

        <button onclick="sendOTP()" id="sendOtpBtn" style="width: 100%; background: #00E87A; color: #0A0A0A; border: none; border-radius: 9999px; padding: 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; transition: opacity 0.2s;">Send Code</button>
      </div>

      <!-- STEP 2: OTP -->
      <div id="authStep2" style="display:none;">
        <p style="font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; margin-bottom: 6px;">Enter the 6-digit code</p>
        <p id="otpSentTo" style="font-family: 'Inter', sans-serif; font-size: 13px; color: #666; margin-bottom: 24px;">Code sent to your number.</p>

        <!-- 6 OTP boxes -->
        <div id="otpBoxes" style="display: flex; gap: 8px; justify-content: center; margin-bottom: 20px;">
          <input type="tel" maxlength="1" class="otp-box" style="width: 44px; height: 54px; background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; color: white; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; text-align: center; outline: none; transition: border-color 0.2s;">
          <input type="tel" maxlength="1" class="otp-box" style="width: 44px; height: 54px; background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; color: white; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; text-align: center; outline: none; transition: border-color 0.2s;">
          <input type="tel" maxlength="1" class="otp-box" style="width: 44px; height: 54px; background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; color: white; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; text-align: center; outline: none; transition: border-color 0.2s;">
          <input type="tel" maxlength="1" class="otp-box" style="width: 44px; height: 54px; background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; color: white; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; text-align: center; outline: none; transition: border-color 0.2s;">
          <input type="tel" maxlength="1" class="otp-box" style="width: 44px; height: 54px; background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; color: white; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; text-align: center; outline: none; transition: border-color 0.2s;">
          <input type="tel" maxlength="1" class="otp-box" style="width: 44px; height: 54px; background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; color: white; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; text-align: center; outline: none; transition: border-color 0.2s;">
        </div>

        <div id="otpError" style="color: #FF4444; font-size: 13px; margin-bottom: 12px; text-align: center; display: none;"></div>

        <button onclick="verifyOTP()" id="verifyOtpBtn" style="width: 100%; background: #00E87A; color: #0A0A0A; border: none; border-radius: 9999px; padding: 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 14px; transition: opacity 0.2s;">Verify Code</button>

        <div style="text-align:center;">
          <button onclick="goBackToPhone()" style="background: none; border: none; color: #666; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer;">← Change number</button>
          <span style="color:#333; margin: 0 8px;">|</span>
          <button id="resendBtn" onclick="resendOTP()" style="background: none; border: none; color: #00E87A; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer;">Resend code</button>
          <span id="resendTimer" style="color: #666; font-size: 13px; font-family: 'Inter', sans-serif; display: none;"></span>
        </div>
      </div>

      <!-- STEP 3: Profile Setup -->
      <div id="authStep3" style="display:none;">
        <p style="font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; margin-bottom: 6px;">Set up your profile</p>
        <p style="font-family: 'Inter', sans-serif; font-size: 13px; color: #666; margin-bottom: 24px;">Almost there! Tell us your name.</p>

        <input type="text" id="nameInput" placeholder="Your full name" style="width: 100%; background: #1A1A1A; border: 1px solid #2A2A2A; color: white; border-radius: 12px; padding: 14px 16px; font-family: 'Inter', sans-serif; font-size: 16px; outline: none; margin-bottom: 16px; transition: border-color 0.2s;" onfocus="this.style.borderColor='#00E87A'" onblur="this.style.borderColor='#2A2A2A'">

        <div id="profileError" style="color: #FF4444; font-size: 13px; margin-bottom: 12px; display: none;"></div>

        <button onclick="saveProfile()" style="width: 100%; background: #00E87A; color: #0A0A0A; border: none; border-radius: 9999px; padding: 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; transition: opacity 0.2s;">Start My Journey 🔥</button>
      </div>

    </div>
  </div>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }
    
    @media (max-width: 400px) {
      .otp-box {
        width: 38px !important;
        height: 48px !important;
        font-size: 18px !important;
      }
      #otpBoxes {
        gap: 6px !important;
      }
      #authModal {
        padding: 24px 16px 36px !important;
      }
    }
    @media (max-width: 340px) {
      .otp-box {
        width: 34px !important;
        height: 44px !important;
        font-size: 16px !important;
      }
      #otpBoxes {
        gap: 4px !important;
      }
    }
  </style>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://nodgmusskamkacofyvgz.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vZGdtdXNza2Fta2Fjb2Z5dmd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTk3MDUsImV4cCI6MjA5NzM5NTcwNX0.iC277LL-yJypKIub7vm9KIrfaek5_i8bgRjHPNvbZBw'
    );

    // Make supabase global so React app can sync with it
    window.globalSupabaseClient = supabase;

    // Check if already logged in on page load
    window.addEventListener('load', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        // Wait 1.5s for React to mount, then navigate
        setTimeout(() => {
          if (window.location.pathname === '/') {
            window.location.href = '/home';
          }
        }, 1500);
      }
    });

    let currentPhone = '';
    let resendInterval = null;

    window.openAuthModal = function() {
      document.getElementById('authOverlay').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    };

    window.closeAuthModal = function() {
      document.getElementById('authOverlay').style.display = 'none';
      document.body.style.overflow = '';
      showStep(1);
    };

    document.getElementById('authOverlay').addEventListener('click', function(e) {
      if (e.target === this) window.closeAuthModal();
    });

    function showStep(n) {
      document.getElementById('authStep1').style.display = n === 1 ? 'block' : 'none';
      document.getElementById('authStep2').style.display = n === 2 ? 'block' : 'none';
      document.getElementById('authStep3').style.display = n === 3 ? 'block' : 'none';
    }

    window.sendOTP = async function() {
      const code = document.getElementById('countryCode').value;
      const number = document.getElementById('phoneInput').value.trim();
      const errorEl = document.getElementById('phoneError');
      const btn = document.getElementById('sendOtpBtn');

      errorEl.style.display = 'none';

      if (!number || number.length < 7) {
        errorEl.textContent = 'Please enter a valid phone number.';
        errorEl.style.display = 'block';
        return;
      }

      let cleaned = number.replace(/^0+/, '');
      currentPhone = code + cleaned;

      btn.textContent = 'Sending...';
      btn.style.opacity = '0.7';
      btn.disabled = true;

      const { error } = await supabase.auth.signInWithOtp({
        phone: currentPhone,
      });

      btn.textContent = 'Send Code';
      btn.style.opacity = '1';
      btn.disabled = false;

      if (error) {
        errorEl.textContent = error.message || 'Failed to send code. Try again.';
        errorEl.style.display = 'block';
        return;
      }

      document.getElementById('otpSentTo').textContent = 'Code sent to ' + currentPhone;
      showStep(2);
      startResendTimer();

      setTimeout(() => {
        document.querySelectorAll('.otp-box')[0].focus();
      }, 100);

      setupOTPBoxes();
    };

    function setupOTPBoxes() {
      const boxes = document.querySelectorAll('.otp-box');
      boxes.forEach((box, i) => {
        box.value = '';
        box.addEventListener('input', function() {
          if (this.value.length > 1) {
             this.value = this.value.slice(-1);
          }
          if (this.value.length === 1 && i < boxes.length - 1) {
            boxes[i + 1].focus();
          }
          const otp = Array.from(boxes).map(b => b.value).join('');
          if (otp.length === 6) verifyOTP();
        });
        box.addEventListener('keydown', function(e) {
          if (e.key === 'Backspace' && !this.value && i > 0) {
            boxes[i - 1].focus();
          }
        });
        box.addEventListener('focus', function() {
          this.style.borderColor = '#00E87A';
        });
        box.addEventListener('blur', function() {
          this.style.borderColor = '#2A2A2A';
        });
      });
    }

    window.verifyOTP = async function() {
      const boxes = document.querySelectorAll('.otp-box');
      const otp = Array.from(boxes).map(b => b.value).join('');
      const errorEl = document.getElementById('otpError');
      const btn = document.getElementById('verifyOtpBtn');

      errorEl.style.display = 'none';

      if (otp.length !== 6) {
        errorEl.textContent = 'Please enter the full 6-digit code.';
        errorEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Verifying...';
      btn.style.opacity = '0.7';
      btn.disabled = true;

      const { data, error } = await supabase.auth.verifyOtp({
        phone: currentPhone,
        token: otp,
        type: 'sms',
      });

      btn.textContent = 'Verify Code';
      btn.style.opacity = '1';
      btn.disabled = false;

      if (error) {
        errorEl.textContent = 'Invalid code. Please try again.';
        errorEl.style.display = 'block';
        document.getElementById('otpBoxes').style.animation = 'shake 0.4s';
        setTimeout(() => {
          document.getElementById('otpBoxes').style.animation = '';
        }, 400);
        return;
      }

      const userId = data.user.id;
      const { data: profile } = await supabase
        .from('profiles')
        .select('name')
        .eq('id', userId)
        .single();

      if (profile && profile.name && profile.name !== 'Fit21 User') {
        window.location.href = '/home';
      } else {
        showStep(3);
      }
    };

    window.saveProfile = async function() {
      const name = document.getElementById('nameInput').value.trim();
      const errorEl = document.getElementById('profileError');

      errorEl.style.display = 'none';

      if (!name || name.length < 2) {
        errorEl.textContent = 'Please enter your name.';
        errorEl.style.display = 'block';
        return;
      }

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { error } = await supabase
        .from('profiles')
        .update({ name: name, phone: currentPhone })
        .eq('id', user.id);

      if (error) {
        errorEl.textContent = 'Something went wrong. Try again.';
        errorEl.style.display = 'block';
        return;
      }

      window.location.href = '/home';
    };

    window.goBackToPhone = function() {
      showStep(1);
      if (resendInterval) clearInterval(resendInterval);
    };

    window.resendOTP = async function() {
      await supabase.auth.signInWithOtp({ phone: currentPhone });
      startResendTimer();
    };

    function startResendTimer() {
      const resendBtn = document.getElementById('resendBtn');
      const resendTimer = document.getElementById('resendTimer');
      let seconds = 30;

      resendBtn.style.display = 'none';
      resendTimer.style.display = 'inline';
      resendTimer.textContent = 'Resend in ' + seconds + 's';

      if (resendInterval) clearInterval(resendInterval);
      resendInterval = setInterval(() => {
        seconds--;
        resendTimer.textContent = 'Resend in ' + seconds + 's';
        if (seconds <= 0) {
          clearInterval(resendInterval);
          resendTimer.style.display = 'none';
          resendBtn.style.display = 'inline';
        }
      }, 1000);
    }
  </script>
</body>
</html>
